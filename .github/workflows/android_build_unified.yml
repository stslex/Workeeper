name: Android CI/CD - Unified Build and Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Wear press ${{ matrix.variant }} / ${{ matrix.observation }}
    if: startsWith(github.ref, 'refs/tags/codex-validation/pr364-wear/')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [Dev, Store]
        observation: [held, no-touch]

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Decrypt keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          echo "$KEYSTORE" > keystore.jks.asc
          gpg -d --passphrase "$KEYSTORE_PASSPHRASE" --batch keystore.jks.asc > keystore.jks

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Configure Keystore
        env:
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        run: |
          {
            echo "storeFile=keystore.jks"
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "storePassword=$KEYSTORE_STORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
          } >> keystore.properties

      - name: Create Google Services Config file
        env:
          GOOGLE_SERVICES_JSON_STORE: ${{ secrets.GOOGLE_SERVICES_JSON_STORE }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_STORE" > app/store/google-services.json.b64
          base64 -d -i app/store/google-services.json.b64 > app/store/google-services.json

      - name: Create Google Services DEV Config file
        env:
          GOOGLE_SERVICES_JSON_DEV: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_DEV" > app/dev/google-services.json.b64
          base64 -d -i app/dev/google-services.json.b64 > app/dev/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Use CI-optimized Gradle properties
        run: cp .github/properties/gradle-ci.properties gradle.properties

      - name: Use CI-optimized Convention Gradle properties
        run: cp .github/properties/gradle-convention-ci.properties build-logic/gradle.properties

      - name: Run one Wear press scenario
        id: wear
        env:
          WEAR_PRESS_OBSERVATION: ${{ matrix.observation }}
          WEAR_VARIANT: ${{ matrix.variant }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_OS" = Linux
          evidence="$RUNNER_TEMP/wear-press-evidence"
          mkdir -p "$evidence"
          python3 -c 'import json, os; print(json.dumps({key: os.getenv(key) for key in ("GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "WEAR_VARIANT", "WEAR_PRESS_OBSERVATION", "RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion")}))' > "$evidence/identity.json"
          set +e
          ./gradlew ":app:wear:test${WEAR_VARIANT}DebugUnitTest" \
            --tests 'io.github.stslex.workeeper.wear.ui.WearDisabledPressGateTest' \
            --rerun-tasks --no-build-cache --no-configuration-cache --full-stacktrace --console=plain \
            2>&1 | tee "$evidence/gradle.log"
          gradle_status=${PIPESTATUS[0]}
          printf '%s\n' "$gradle_status" > "$evidence/gradle-exit-code.txt"
          exit "$gradle_status"

      - name: Retain XML, captures and exact masks
        if: ${{ always() && steps.wear.outcome != 'skipped' }}
        env:
          WEAR_VARIANT: ${{ matrix.variant }}
        run: |
          evidence="$RUNNER_TEMP/wear-press-evidence"
          captures="app/wear/build/reports/wear-press"
          mkdir -p "$evidence/captures"
          if test -d "$captures"; then
            find "$captures" -maxdepth 1 -type f -name '*.png' -exec cp {} "$evidence/captures/" \;
          fi
          xml="app/wear/build/test-results/test${WEAR_VARIANT}DebugUnitTest/TEST-io.github.stslex.workeeper.wear.ui.WearDisabledPressGateTest.xml"
          if test -f "$xml"; then
            cp "$xml" "$evidence/junit.xml"
          fi
          python3 .github/scripts/wear_press_capture_diff.py "$evidence/captures" "$evidence/masks"
          test -f "$evidence/junit.xml"
          test -f "$evidence/masks/XL_ROUND-1.24-disabled-mask.png"

      - name: Upload one flavor and control
        if: ${{ always() && steps.wear.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: wear-press-${{ matrix.variant }}-${{ matrix.observation }}
          path: ${{ runner.temp }}/wear-press-evidence
          if-no-files-found: error
          retention-days: 30
