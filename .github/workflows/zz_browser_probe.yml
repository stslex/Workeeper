name: zz browser probe (temporary, delete me)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Does an explicitly installed Chrome deb work
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record what the image shipped, before we touch anything
        run: |
          echo "image google-chrome : $(/usr/bin/google-chrome --version 2>&1 || echo absent)"
          echo "image chromium      : $(/usr/bin/chromium --version 2>&1 || echo absent)"
          dpkg -l google-chrome-stable 2>/dev/null | tail -2 || echo "(deb not registered)"

      - name: Why does the unpacked build hang? capture its stderr
        run: |
          set +e
          timeout 25 /usr/bin/chromium --headless --disable-gpu --no-sandbox \
            --user-data-dir=/tmp/diag-profile --virtual-time-budget=8000 \
            --window-size=420,900 --dump-dom about:blank > /tmp/diag.out 2> /tmp/diag.err
          echo "exit=$? (124 == timeout)"
          echo "--- stdout (first 5 lines) ---"; head -5 /tmp/diag.out
          echo "--- stderr (last 25 lines) ---"; tail -25 /tmp/diag.err

      - name: Install Google Chrome explicitly, from Google's own deb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/google-chrome-stable.deb" \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP/google-chrome-stable.deb"
          echo "after install    : $(/usr/bin/google-chrome --version)"
          dpkg -l google-chrome-stable | tail -1

      - name: Probe the explicitly installed deb with the gate's own machinery
        run: |
          python3 - <<'PY'
          import importlib.util, os, subprocess, time

          spec = importlib.util.spec_from_file_location("sg", "documentation/mockups/shell_gate.py")
          sg = importlib.util.module_from_spec(spec); spec.loader.exec_module(sg)
          sg.PROBE_TIMEOUT_S = 45

          root = sg.repo_root()
          src = sg.read_target(root, None, sg.MOCKUP)

          for name, path in [("explicit deb /usr/bin/google-chrome", "/usr/bin/google-chrome"),
                             ("explicit deb google-chrome-stable", "/usr/bin/google-chrome-stable")]:
              if not os.path.exists(path):
                  print(f"{name:38} ABSENT"); continue
              ver = subprocess.run([path, "--version"], capture_output=True, text=True).stdout.strip()
              t0 = time.time()
              try:
                  p = sg.run_probe(src, path, False)
                  pill = p.get("pill", {}); fab = p.get("fab", {})
                  print(f"{name:38} OK   {time.time()-t0:5.1f}s  stage={p.get('stage')} "
                        f"w1={pill.get('w1')} w2={pill.get('w2')} x1={pill.get('x1')} x2={pill.get('x2')} "
                        f"targetX={pill.get('targetX')} radius={fab.get('before',{}).get('radius')}"
                        f"->{fab.get('after',{}).get('radius')} | {ver}")
              except SystemExit as e:
                  print(f"{name:38} FAIL {time.time()-t0:5.1f}s  {str(e).splitlines()[0]} | {ver}")
          PY

      - name: And the full gate, end to end, with the deb shadowed as chromium
        run: |
          mkdir -p "$RUNNER_TEMP/browser-bin"
          ln -sfn /usr/bin/google-chrome "$RUNNER_TEMP/browser-bin/chromium"
          export PATH="$RUNNER_TEMP/browser-bin:$PATH"
          echo "chromium -> $(readlink -f "$(command -v chromium)")"
          STATUS=0
          python3 documentation/mockups/shell_gate.py --target f52462c7 > /tmp/kn.log 2>&1 || STATUS=$?
          echo "known negative exit=$STATUS"
          grep -E '^  \[(PASS|FAIL)\] 7' /tmp/kn.log || true
          grep -E '^  \[(PASS|FAIL)\] 6' /tmp/kn.log || true
          BASE=$(git merge-base origin/docs/v3-token-parity HEAD)
          python3 documentation/mockups/shell_gate.py --base "$BASE" -v > /tmp/gate.log 2>&1
          echo "gate exit=$?"
          grep -E '^  \[(PASS|FAIL)\]|passed, ' /tmp/gate.log
