[versions]
androidDesugarJdkLibs = "2.1.5"
kotlin = "2.4.10"
# KSP 2.3.9 (not 2.3.6): 2.3.6 silently skips KMP/native codegen — a proven false-green
# (Probe-2). KSP2 is Kotlin-decoupled; drives Room's DAO codegen (the only KSP consumer).
ksp = "2.3.9"
androidGradlePlugin = "9.3.0"
androidTools = "32.3.0"

minSdk = "28"
targetSdk = "37"
compileSdk = "37"
versionName = "1.50.0"
versionCode = "51"

ktx = "1.19.0"
material = "1.14.0"
immutableCollection = "0.5.1"
lifecycle = "2.11.0"
coroutines = "1.11.0"

composeBom = "2026.07.00"
composeGradle = "1.11.1"
# CMP artifact lines. The core artifacts (runtime/foundation/ui/components-resources) release
# at the plugin (composeGradle) version; material3 rides its own decoupled line. Keep this
# pair in step when bumping CMP — the pairing for a given plugin version is what the plugin's
# own accessors resolve (documentation/feature-specs/kmp-phase-2-probes.md, "Findings" §3).
cmpMaterial3 = "1.9.0"
navigation3 = "1.1.6"
composeJunit = "1.11.4"
coil = "3.5.0"
composeActivity = "1.13.0"
fbBom = "34.16.0"
fbPerf = "2.0.2"

workManager = "2.11.2"

mockk = "1.14.11"
junit = "6.1.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
robolectric = "4.16.1"
androidxTest = "1.7.0"
kermit = "2.1.0"
robolectricExt = "0.9.0"
gms = "4.5.0"
fbCrashlytics = "3.0.7"

# room = "2.8.4" was the androidx.room 2.x line; superseded by the room3 (androidx.room3)
# coordinates below, which are the applied ones. The 2.x version key is gone with its coords.
# androidx.sqlite 2.7.0 (transitive of room3-runtime): every Room 3 builder selects a driver
# explicitly. sqlite-bundled supplies the production Android driver for KMP Room modules;
# sqlite-framework remains for classic Android modules and Robolectric host-test fixtures.
room3 = "3.0.0"
sqlite = "2.7.0"
serialization = "1.11.0"
datetime = "0.8.0"
paging = "3.5.0"
slf4j = "2.0.17"
coroutineTest = "1.11.0"
datastore = "1.2.1"
detekt = "1.23.8"
# Visual gate for the v3 redesign. 2.0.0-alpha05 is the latest release (there is no alpha06).
# Stable 1.3.5 cannot configure on AGP 9: it reaches for BaseExtension, removed in AGP 9.0.
paparazzi = "2.0.0-alpha05"
detektCompose = "0.6.3"

ktor = "3.5.1"
playServicesAuth = "21.6.0"

junitKtx = "1.3.0"

# Other tools
haze = "1.7.2"

# DI — Metro compiler plugin, applied repo-wide (the sole DI framework). 1.3.x is built
# against Kotlin 2.4.0 (1.3.2 tests up through Kotlin 2.5.0-dev), so it moves in lockstep
# with the kotlin pin above; 1.1.1 was the last Kotlin-2.3.x line.
metro = "1.3.2"
[libraries]
android-desugarJdkLibs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "androidDesugarJdkLibs" }
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }

kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
android-tools-common = { group = "com.android.tools", name = "common", version.ref = "androidTools" }
room-gradlePlugin = { group = "androidx.room3", name = "room3-gradle-plugin", version.ref = "room3" }
# The Compose MULTIPLATFORM Gradle plugin artifact (org.jetbrains.compose), NOT the Kotlin
# compose-compiler plugin.
cmp-gradlePlugin = { group = "org.jetbrains.compose", name = "compose-gradle-plugin", version.ref = "composeGradle" }

# CMP runtime artifacts for commonMain (KMP+Compose convention). Jetbrains coordinates;
# on the android target they resolve to the matching androidx artifacts.
cmp-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeGradle" }
cmp-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeGradle" }
cmp-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeGradle" }
cmp-uiToolingPreview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "composeGradle" }
cmp-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "cmpMaterial3" }
cmp-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeGradle" }
fbCrashlytics-gradlePlugin = { module = "com.google.firebase:firebase-crashlytics-gradle", version.ref = "fbCrashlytics" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "ktx" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
lifecycle-viewModel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# KMP lifecycle runtime (2.10.0 publishes iosArm64/iosSimulatorArm64): LifecycleOwner,
# LifecycleObserver and lifecycleScope used by AppCoroutineScope(Impl) in commonMain.
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "lifecycle" }
coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# KMP coroutines core (commonMain-safe; pulls android/native variants per target).
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

kotlin-compiler-embeddable = { group = "org.jetbrains.kotlin", name = "kotlin-compiler-embeddable", version.ref = "kotlin" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom-alpha", version.ref = "composeBom" }

androidx-compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "composeActivity" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material = { group = "androidx.compose.material", name = "material" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-animationGraphics = { group = "androidx.compose.animation", name = "animation-graphics" }
androidx-compose-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }

androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }

androidx-compose-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "composeJunit" }

dev-haze-core = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
dev-haze-materials = { group = "dev.chrisbanes.haze", name = "haze-materials", version.ref = "haze" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

androidx-compose-paging = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "paging" }
# The KMP home of PagingSource/PagingData (publishes iosSimulatorArm64); what KMP data modules
# declare instead of the Android-only paging-runtime-ktx.
androidx-paging-common = { group = "androidx.paging", name = "paging-common", version.ref = "paging" }
androidx-paging-testing = { group = "androidx.paging", name = "paging-testing", version.ref = "paging" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "immutableCollection" }

kermit = { group = "co.touchlab", name = "kermit", version.ref = "kermit" }

junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
# The Paparazzi runtime as a plain artifact. The plugin puts it on `testImplementation` only,
# so the shared golden harness in core:ui:kit's testFixtures needs it named explicitly.
paparazzi-core = { group = "app.cash.paparazzi", name = "paparazzi", version.ref = "paparazzi" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
mockk-agent = { group = "io.mockk", name = "mockk-agent", version.ref = "mockk" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# Runtime half of robolectric-junit5 (RobolectricExtension) for KMP androidHostTest source sets.
robolectric-junit5-extension = { group = "tech.apter.junit5.jupiter", name = "robolectric-extension", version.ref = "robolectricExt" }
androidx-test = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTest" }

# Room 3.0 (androidx.room3). The alias names keep the -room- shape so consumers and the
# convention plugin are unchanged; only the group/artifact moved from androidx.room ->
# androidx.room3. room3 folded the old room-ktx (coroutine/Flow support) into room3-runtime,
# so there is no room3-ktx artifact and the bundle drops it.
androidx-room-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
androidx-room-paging = { group = "androidx.room3", name = "room3-paging", version.ref = "room3" }
androidx-room-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }
androidx-room-testing = { group = "androidx.room3", name = "room3-testing", version.ref = "room3" }

# The driver-agnostic base API (SQLiteConnection/SQLiteStatement/SQLiteException) — what code
# that only TALKS ABOUT SQLite depends on, without choosing an engine. KMP-published.
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqlite" }
# AndroidSQLiteDriver (framework SQLite) — classic Android modules and JVM host-test fixtures.
androidx-sqlite-framework = { group = "androidx.sqlite", name = "sqlite-framework", version.ref = "sqlite" }
# BundledSQLiteDriver — the production Android driver for KMP Room modules.
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-datastore-core = { group = "androidx.datastore", name = "datastore-core", version.ref = "datastore" }
# The COMMON half of the preferences API: PreferenceDataStoreFactory.createWithPath(() -> okio.Path).
# The `() -> File` overload lives in datastore-preferences's jvmAndroidMain, so a commonMain store
# must build on this artifact; the Android source set still takes datastore-preferences for the
# Context.preferencesDataStoreFile extension that pins the on-disk path.
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }

javax-inject = { group = "javax.inject", name = "javax.inject", version = "1" }

androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workManager" }

coroutine-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutineTest" }
coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

google-play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "playServicesAuth" }

google-gms = { module = "com.google.gms:google-services", version.ref = "gms" }
google-firebase-plugin-perf = { group = "com.google.firebase", name = "perf-plugin", version.ref = "fbPerf" }
google-firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "fbBom" }
google-firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
google-firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
google-firebase-perf = { group = "com.google.firebase", name = "firebase-perf" }

androidx-junit-ktx = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "junitKtx" }

detekt-gradle = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
detekt-rules-compose = { module = "io.nlopez.compose.rules:detekt", version.ref = "detektCompose" }
detekt-api = { module = "io.gitlab.arturbosch.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "io.gitlab.arturbosch.detekt:detekt-test", version.ref = "detekt" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# KMP toolchain. androidKmpLibrary is AGP's KMP-native library plugin (AGP 9.0+ rejects
# com.android.library + kotlin-multiplatform together); KmpLibraryConventionPlugin applies
# it. androidLint is the STANDALONE lint plugin: AGP creates lint reporting tasks on a KMP
# module only when it is co-applied (KmpTaskManager guards on LINT_PLUGIN_ID) — without it
# a KMP module has no lint task at all and vanishes from the repo-wide lintDebug gate.
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
androidLint = { id = "com.android.lint", version.ref = "androidGradlePlugin" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Compose Multiplatform plugin (Phase C.1) — provides the `compose.*` runtime DSL for KMP/iOS.
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeGradle" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room3", version.ref = "room3" }
robolectric-junit5 = { id = "tech.apter.junit5.jupiter.robolectric-extension-gradle-plugin", version.ref = "robolectricExt" }
gms = { id = "com.google.gms.google-services", version.ref = "gms" }
firebaseCrashlytics = { id = "com.google.firebase.crashlytics", version.ref = "fbCrashlytics" }
firebasePerf = { id = "com.google.firebase.firebase-perf", version.ref = "fbPerf" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }

convention-application-common = { id = "workeeper.android.application.common", version = "1.0" }
convention-application-store = { id = "workeeper.android.application.store", version = "1.0" }
convention-application-dev = { id = "workeeper.android.application.dev", version = "1.0" }

convention-androidLibrary = { id = "workeeper.android.androidLibrary", version = "1.0" }
convention-kmpLibrary = { id = "workeeper.kmp.library", version = "1.0" }
convention-composeLibrary = { id = "workeeper.android.composeLibrary", version = "1.0" }
# KMP+Compose convention. Named so it CANNOT be mistaken for the Android-only
# composeLibrary above, which the live Android modules keep applying until Phase 7.
convention-kmpComposeLibrary = { id = "workeeper.kmp.composeLibrary", version = "1.0" }
convention-roomLibrary = { id = "workeeper.room.library", version = "1.0" }
convention-lint = { id = "workeeper.lint.convention", version = "1.0" }

[bundles]
lifecycle = [
    "lifecycle-compose",
    "lifecycle-viewModel"
]

compose = [
    "androidx-compose-activity",
    "androidx-compose-material3",
    "androidx-compose-ui",
    "androidx-compose-material-icons-core",
    "androidx-compose-material-icons-extended",
    "androidx-compose-tooling-preview",
    "androidx-compose-foundation",
    "androidx-compose-paging",
    "androidx-compose-animation",
    "androidx-compose-animationGraphics",
    "androidx-compose-runtime",
    "coil-compose"
]

android-test = [
    "androidx-junit",
    "androidx-espresso-core",
    "androidx-test-runner"
]

test = [
    "mockk-android",
    "mockk-agent",
    "junit-jupiter",
    "robolectric",
    "androidx-test",
    "coroutine-test",
]

room = [
    "androidx-room-runtime",
    "androidx-room-paging"
]
