# (Probe-2). Repo-wide single source of truth; must survive existing Hilt-Android codegen.
ksp = "2.3.9"
androidGradlePlugin = "9.1.0"
androidTools = "32.1.0"

minSdk = "28"
targetSdk = "37"
compileSdk = "36"
versionName = "1.48.0"
versionCode = "49"

ktx = "1.17.0"
material = "1.13.0"
appcompat = "1.7.1"
immutableCollection = "0.4.0"
lifecycle = "2.10.0"
coroutines = "1.10.2"

composeBom = "2026.03.00"
composeGradle = "1.10.3"
composeNavigation = "2.9.8"
composeJunit = "1.11.0"
accompanist = "0.36.0"
coil = "3.4.0"
